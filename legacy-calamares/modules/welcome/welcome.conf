# welcome.conf — page01 (Select Installer Language)
# This is Calamares's own built-in welcome module, we're only configuring
# it: enabling the language selector, and the "About DreamerOS" button we
# added this session (bottom-left of the card, opens the modal below).

showSupportUrl:    false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 8.0     # GB — realistic floor even for Scratch once you add a user + updates
  requiredRam: 2.0
  internetCheckUrl: "https://archlinux.org"
  check:
    - storage
    - ram
    - internet
  required:
    - storage

# Custom addition: the "About DreamerOS" button + modal content
aboutText: |
  DreamerOS is an operating system built on Linux, based on Arch Linux —
  so you get the power Arch gives you, but better. You're in the installer
  right now, but did you notice Arch doesn't normally have an installer?
  You don't. That's already something good about DreamerOS.

  There are three editions to choose from (pick one at page 06):

  Game — For gamers. Lightweight, but can't save an old machine.
  Develop — A full desktop with the tools builders need, ready to code
  from first boot.
  Scratch — Very lightweight — a stripped version of KDE. Runs on just
  4GB of RAM and 32GB of storage.

  Version 1.0 — "Shamer"
