# dreamervariant.conf
# Defines the three DreamerOS editions shown on page03, and what page03b
# ("Software selection") + the exec-time package install actually pulls in
# for each one.

title: "Choose Your DreamerOS"

variants:
  - id: game
    name: "Game"
    tagline: "For gamers"
    description: "Lightweight, but can't save an old machine."
    desktop: kde
    packages:
      - base
      - linux
      - linux-firmware
      - plasma-desktop
      - sddm
      - steam
      - lutris
      - vulkan-icd-loader
    # MangoHud is opt-in, shown as a checkbox on page03b — NOT bundled by
    # default. (This overrides an earlier session's "never include it"
    # decision; current answer is optional, off by default.)
    optionalPackages:
      - id: mangohud
        label: "MangoHud (in-game performance overlay)"
        default: false
        packages: [ mangohud ]

  - id: develop
    name: "Develop"
    tagline: "For developers"
    description: "A full desktop with the tools builders need, ready to code from first boot."
    desktop: kde
    packages:
      - base
      - linux
      - linux-firmware
      - plasma-desktop
      - sddm
      - konsole
      - kate
      - git
      - base-devel
      - docker

  - id: scratch
    name: "Scratch"
    tagline: "Lightweight, terminal only"
    description: "Very lightweight — a stripped version of KDE. Runs on 4GB RAM, 32GB storage."
    desktop: kde-minimal
    packages:
      - base
      - linux
      - linux-firmware
      - plasma-desktop   # stripped further at exec-time by dreamerdesktop, see its scratchStrip list
      - sddm
      - brave-bin
    # These are the Scratch-only strip rules from the session notes, applied
    # by the exec-time half of this module after packages install:
    scratchStrip:
      removeBundledKdeApps: true      # no Kate, no Dolphin extras, no games
      keepOnlyNewestKernel: true
      keepOnlyUsedLocales: true       # locale(s) picked on page02, rest stripped
      keepOnlyTargetFirmware: true    # firmware for detected hardware only
      packageManager: pacman-only     # no flatpak/snap
      removeManPages: true
      wallpaper: fixed-black          # no picker, no page06c/06d
      themeToggle: dark-light-only

# page03b software list per variant is generated FROM the "packages" +
# "optionalPackages" arrays above — no separate config needed.
