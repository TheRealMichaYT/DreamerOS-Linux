# dreamerdesktop.conf
# Covers page06 (Desktop Environment), page06b (Dark/Light), page06c
# (Custom Wallpaper? yes/no) and page06d (Color1/Color2 picker).
#
# IMPORTANT: this whole module is skipped at runtime when
# GlobalStorage["dreamerVariant"] == "scratch" — see
# DreamerDesktopViewStep::isVisible(). Scratch gets its fixed black
# wallpaper from ScratchStripJob instead (in dreamervariant), and never
# shows page06c/06d at all, per the session spec.

desktopEnvironments:
  - id: kde
    name: "KDE Plasma"
  - id: gnome
    name: "GNOME"

# The 30-wallpaper set: every combination of these 6 colors with itself,
# excluding same-color pairs (Color2 can't equal Color1 — that file simply
# doesn't exist in the set).
wallpaperColors:
  - blue
  - gold
  - green
  - purple
  - red
  - pink

wallpaperAssetPattern: "/usr/share/dreameros/wallpapers/%1-%2-wallpaper.png"  # %1=color1 %2=color2
defaultWallpaper: "diagonal-lines-blue-gold-wallpaper.png"

title: "Choose your desktop"
wallpaperQuestionTitle: "Custom Wallpaper?"
wallpaperQuestionSubtitle: "Would you like to choose your own two-color wallpaper?"
colorPickerTitle: "Choose Your Colors"
