# locale.conf — page02 (Region, Timezone, Keyboard) + NTP toggle
# Built-in Calamares locale module. The NTP row we added this session maps
# straight onto Calamares's own "automatic time sync" option — no custom
# code needed, just turning it on and defaulting it to ON as designed.

region: ""      # left blank -> map click / dropdown picks it, per the mockup
zone: ""

geoip:
  style: "json"
  url: "https://geoip.kde.org/v1/calamares"
  selector: "TimezoneResult"

# --- NTP row (the addition made this session) ---
automaticTimeSync: true      # default ON, matches the pill-toggle mockup
ntpServer: "pool.ntp.org"
