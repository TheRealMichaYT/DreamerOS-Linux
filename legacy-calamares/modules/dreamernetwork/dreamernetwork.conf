# dreamernetwork.conf
# ---------------------------------------------------------------------
# Controls the "Connect to a Network" page (page01b), between Language
# and Region/Timezone in the install flow.

# If true, NEXT stays blocked and the red "No network connection
# detected" banner shows until either a Wi-Fi network is joined or the
# Ethernet checkbox is ticked. Set to false only for offline/testing
# builds — DreamerOS ships with this enabled.
requireConnection: true

title: "Connect to a Network"
subtitle: "Pick a Wi-Fi network, or use Ethernet."
ethernetLabel: "I use Ethernet"
ethernetSubtext: "Skip Wi-Fi setup, my cable is plugged in"
errorText: "No network connection detected"
errorSubtext: "Pick a Wi-Fi network or plug in Ethernet to continue."

# How long (ms) to wait after joining a network before re-checking
# connectivity and unblocking NEXT.
connectPollIntervalMs: 1500
