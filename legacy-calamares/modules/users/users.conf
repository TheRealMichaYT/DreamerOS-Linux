# users.conf — page04a (empty list), 04b (add user), 04c (user list), 04d (root password)
# Built-in Calamares users module.

userShell: "/bin/bash"

setRootPassword: true          # page04d
doAutologin: false
sudoersGroup: "wheel"
passwordRequirements:
  minLength: 4
  maxLength: -1

# "login without password" is locked whenever sudo is enabled — this was
# already true in the original package and is Calamares's default
# behaviour with allowWeakPasswords left false, kept as-is:
allowWeakPasswords: false
allowWeakPasswordsDefault: false
