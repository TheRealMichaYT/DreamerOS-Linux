# DreamerOS Installer — Calamares settings.conf
# This is the master sequence file: it lists every page of the installer,
# in order, and whether each one is a *view* module (shows a page) or an
# *exec* module (runs during the install itself, no page shown).
#
# Pages that say "custom C++" below are DreamerOS-specific modules we wrote
# ourselves (see modules/dreamer*/ for their source). Everything else is a
# module that ships with Calamares itself — we only had to write a small
# .conf file to configure it, not C++ code.

modules-search: [ local ]

instances:
- id: dreamernetwork
  module: dreamernetwork
  config: dreamernetwork.conf

sequence:
# ---- page01: Select Installer Language ------------------------------
# Core Calamares module (welcome). Also where the "About DreamerOS" modal
# button lives — see modules/welcome/welcome.conf's aboutText field.
- show:
  - welcome

# ---- page01b: Connect to a Network -----------------------------------
# Custom C++ (DreamerOS-specific: Wi-Fi list + Ethernet checkbox +
# the "No network connection detected" blocking error state)
  - dreamernetwork@dreamernetwork

# ---- page02: Region, Timezone, Keyboard + NTP toggle -----------------
# Core Calamares module (locale). NTP row is Calamares's built-in
# "automatic time sync via systemd-timesyncd" option, we just turn it on.
  - locale

# ---- page03 + page03b: Variant choice + Software selection -----------
# Custom C++ (DreamerOS-specific: Game / Develop / Scratch cards,
# and the per-variant software list that follows the choice)
  - dreamervariant

# ---- page04a-d: Users, root password ----------------------------------
# Core Calamares module (users)
  - users

# ---- page05: Hostname --------------------------------------------------
# Core Calamares module (hostname)
  - hostname

# ---- page06, 06b, 06c, 06d: Desktop environment, dark/light, wallpaper -
# Custom C++ (DreamerOS-specific: KDE/GNOME picker, dark/light toggle,
# the "Custom wallpaper? yes/no" branch, and the Color1/Color2 picker
# with live preview. On Scratch this whole module is skipped — see
# dreamerdesktop.conf's "skip-if-variant: scratch" below.)
  - dreamerdesktop

# ---- page07: Partitioning ----------------------------------------------
# Core Calamares module (partition)
  - partition

# ---- page08: Summary ----------------------------------------------------
# Core Calamares module (summary)
  - summary

# ---- page09: Install button / page10: Installing (progress) -----------
# From here on these are *exec* modules: no page shown per step, this is
# the "installing..." screen driving through them with the live log list.
- exec:
  - dreamervariant  # actually applies the pacman package list chosen on page03/03b
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - users
  - hostname
  - dreamerdesktop  # applies DE + wallpaper choice made on page06-06d
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount

# ---- page11: Finished / reboot ------------------------------------------
- show:
  - finished

branding: dreameros
prompt-install: false
dont-chroot: false
